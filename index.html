<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koleksi Karya — Rudi Nofindra</title>
  <meta name="description" content="Koleksi media pembelajaran interaktif berbasis budaya karya Rudi Nofindra.">
  <style>
    :root { --bg: #14100e; --card: #211915; --line: #3a2c24; --ink: #f4ead8; --muted: #b9a896; --gold: #e3c27a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top right, #3d1414, var(--bg) 60%); color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 48px 16px; }
    main { max-width: 760px; margin: 0 auto; }
    .eyebrow { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin: 0 0 12px; }
    p.lead { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--line);
      border-radius: 14px; background: var(--card); color: var(--ink); text-decoration: none; font-weight: 600; }
    a.item:hover, a.item:focus-visible { border-color: var(--gold); }
    a.item span { color: var(--gold); white-space: nowrap; }
    footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Yayasan Svara Bumei Betuah · Rudi Nofindra</p>
    <h1>Koleksi Karya</h1>
    <p class="lead">Media pembelajaran interaktif yang berakar pada warisan budaya.</p>
    <ul id="list">
      <!-- Daftar cadangan; diperbarui otomatis dari isi repositori bila GitHub API dapat diakses. -->
      <li><a class="item" href="Mengenal%20Ka%20Ga%20Nga.html">Mengenal Ka Ga Nga <span>Buka →</span></a></li>
    </ul>
    <footer><a href="https://rudichaniago.github.io/">← Kembali ke etalase karya</a></footer>
  </main>
  <script>
    (async () => {
      try {
        const res = await fetch("https://api.github.com/repos/rudichaniago/karya/contents/", { headers: { Accept: "application/vnd.github+json" } });
        if (!res.ok) return;
        const files = (await res.json()).filter((f) => f.type === "file" && /\.html?$/i.test(f.name) && !/^(index|404)\.html?$/i.test(f.name));
        if (!files.length) return;
        const list = document.getElementById("list");
        list.replaceChildren(...files.map((f) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "item";
          a.href = f.path.split("/").map(encodeURIComponent).join("/");
          a.textContent = f.name.replace(/\.html?$/i, "") + " ";
          const s = document.createElement("span");
          s.textContent = "Buka →";
          a.append(s);
          li.append(a);
          return li;
        }));
      } catch (e) { /* tetap tampilkan daftar cadangan */ }
    })();
  </script>
</body>
</html>
